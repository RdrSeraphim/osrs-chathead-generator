services:
  osrs-chathead-generator:
    build: .
    container_name: osrs-chathead-generator
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - OSRS_ADMIN_TOKEN=${OSRS_ADMIN_TOKEN:-}
      - OSRS_ALLOW_HOST_CACHES=0
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - osrs-cache:/app/cache
      # Or bind-mount a host cache directory (ensure UID 1000 can write, e.g.: chown 1000:1000 ./cache):
      # - ./cache:/app/cache

volumes:
  osrs-cache:
